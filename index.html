<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We Have Moved</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f9;
      }
      .container {
        text-align: center;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin: 0 8px;
      }
      .img {
        max-width: 50%;
        height: auto;
        margin-bottom: 20px;
      }
      .moved {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px 0;
        padding: 10px 20px;
        background-color: #007bff;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        transition: background-color 0.3s ease;
      }
      .moved:hover {
        background-color: #0056b3;
      }
      p {
        margin: 10px 0;
        color: #333;
      }
      p a {
        color: #007bff;
        text-decoration: none;
      }
      p a:hover {
        text-decoration: underline;
      }
      .or {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./moved.png" alt="we have moved" class="img" />
      <a href="https://fr-fac-arts.vercel.app/" class="moved">Click here</a>
      <p class="or">OR</p>
      <p>
        New :
        <a href="https://fr-fac-arts.vercel.app/"
          >https://fr-fac-arts.vercel.app/</a
        >
      </p>
    </div>
  </body>
</html>
